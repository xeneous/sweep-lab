<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CR Bot — v1 vs v2</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0d0d0d; color: #e0e0e0; font-family: 'Segoe UI', monospace; padding: 20px; }
  h1 { color: #fff; font-size: 1.3rem; margin-bottom: 4px; }
  .subtitle { color: #666; font-size: 0.8rem; margin-bottom: 20px; }

  .grid-top { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .kpi { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 8px; padding: 14px; text-align: center; }
  .kpi .label { font-size: 0.7rem; color: #666; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
  .kpi .val { font-size: 1.5rem; font-weight: 700; }
  .kpi .sub { font-size: 0.7rem; color: #555; margin-top: 4px; }
  .green { color: #00e676; } .red { color: #ff5252; } .blue { color: #40c4ff; } .gold { color: #ffd740; }

  .section { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 8px; padding: 16px; margin-bottom: 20px; }
  .section h2 { font-size: 0.85rem; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 14px; }

  table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
  th { color: #555; font-weight: 500; text-align: right; padding: 6px 10px; border-bottom: 1px solid #222; }
  th:first-child { text-align: left; }
  td { text-align: right; padding: 7px 10px; border-bottom: 1px solid #1e1e1e; }
  td:first-child { text-align: left; font-weight: 600; color: #fff; }
  tr:hover { background: #222; }

  .badge { display: inline-block; padding: 2px 7px; border-radius: 4px; font-size: 0.7rem; font-weight: 700; }
  .v1 { background: #1a3a5c; color: #40c4ff; }
  .v2 { background: #1a3d2a; color: #00e676; }

  .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 700px) { .charts { grid-template-columns: 1fr; } }
  .chart-box { position: relative; height: 260px; }

  .refresh { color: #444; font-size: 0.72rem; text-align: right; margin-top: 12px; }
  .loading { color: #555; text-align: center; padding: 40px; }

  .winner { background: #1a2a1a; }
  .diff-positive { color: #00e676; }
  .diff-negative { color: #ff5252; }
</style>
</head>
<body>

<h1>CR Bot — v1 vs v2</h1>
<div class="subtitle" id="lastUpdate">Cargando...</div>

<div class="grid-top" id="kpiRow"></div>

<div class="section">
  <h2>Por par — comparativo</h2>
  <table id="pairTable">
    <thead>
      <tr>
        <th>Par</th>
        <th>Trades v1</th><th>WR% v1</th><th>PnL v1</th>
        <th>Trades v2</th><th>WR% v2</th><th>PnL v2</th>
        <th>Δ PnL</th>
      </tr>
    </thead>
    <tbody id="pairBody"><tr><td colspan="8" class="loading">Cargando...</td></tr></tbody>
  </table>
</div>

<div class="section">
  <h2>Evolución PnL acumulado</h2>
  <div class="chart-box"><canvas id="pnlChart"></canvas></div>
</div>

<div class="charts">
  <div class="section">
    <h2>Win Rate por par</h2>
    <div class="chart-box"><canvas id="wrChart"></canvas></div>
  </div>
  <div class="section">
    <h2>Distribución closes</h2>
    <div class="chart-box"><canvas id="reasonChart"></canvas></div>
  </div>
</div>

<div class="section">
  <h2>Últimos 20 trades</h2>
  <table id="recentTable">
    <thead>
      <tr>
        <th>Hora UTC</th><th>Par</th><th>Ver</th><th>Lado</th>
        <th>Razón</th><th>PnL</th><th>Vela cierre</th>
      </tr>
    </thead>
    <tbody id="recentBody"><tr><td colspan="7" class="loading">Cargando...</td></tr></tbody>
  </table>
</div>

<div class="refresh" id="refreshLine">— actualiza cada 30s —</div>

<script>
const SUPABASE_URL = 'https://xjznnlzvurfwrhomkxed.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhqem5ubHp2dXJmd3Job21reGVkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxODYyNDIsImV4cCI6MjEwMTc2MjI0Mn0.GAGSQ3oqTYq1zD96fQ6T--vACw8oWOUqYKWBRT9rqMc';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const PAIRS = ['1000PEPE/USDT','1000SHIB/USDT','XRP/USDT','1000BONK/USDT','NOT/USDT','ADA/USDT'];
const SHORT_NAME = s => s.replace('1000','').replace('/USDT','');

let pnlChart = null, wrChart = null, reasonChart = null;

function fmt(n, decimals=2) {
  if (n == null) return '—';
  return (n >= 0 ? '+' : '') + Number(n).toFixed(decimals);
}
function fmtWR(wins, total) {
  if (!total) return '—';
  return (wins/total*100).toFixed(1)+'%';
}

async function load() {
  const { data, error } = await sb
    .from('trades')
    .select('*')
    .in('bot_variant', ['cr_paper','cr_v2_paper'])
    .order('open_time', { ascending: true });

  if (error) { console.error(error); return; }

  const closed = data.filter(t => t.status === 'closed');
  const v1 = closed.filter(t => t.bot_variant === 'cr_paper');
  const v2 = closed.filter(t => t.bot_variant === 'cr_v2_paper');

  renderKPIs(v1, v2);
  renderPairTable(v1, v2);
  renderPnlChart(v1, v2);
  renderWRChart(v1, v2);
  renderReasonChart([...v1, ...v2]);
  renderRecent(data);

  document.getElementById('lastUpdate').textContent =
    `Actualizado: ${new Date().toLocaleTimeString()} UTC | v1: ${v1.length} trades | v2: ${v2.length} trades`;
}

function stats(trades) {
  const wins   = trades.filter(t => (t.pnl||0) > 0).length;
  const total  = trades.length;
  const pnl    = trades.reduce((s,t) => s + (t.pnl||0), 0);
  return { wins, total, pnl, wr: total ? wins/total*100 : 0 };
}

function renderKPIs(v1, v2) {
  const s1 = stats(v1), s2 = stats(v2);
  const kpis = [
    { label:'Trades v1', val: s1.total, cls:'blue', sub:`${s1.wins}W / ${s1.total-s1.wins}L` },
    { label:'WR v1',     val: s1.total ? s1.wr.toFixed(1)+'%' : '—', cls: s1.wr>=50?'green':'red', sub:'' },
    { label:'PnL v1',    val: fmt(s1.pnl)+' U', cls: s1.pnl>=0?'green':'red', sub:'' },
    { label:'Trades v2', val: s2.total, cls:'gold', sub:`${s2.wins}W / ${s2.total-s2.wins}L` },
    { label:'WR v2',     val: s2.total ? s2.wr.toFixed(1)+'%' : '—', cls: s2.wr>=50?'green':'red', sub:'' },
    { label:'PnL v2',    val: fmt(s2.pnl)+' U', cls: s2.pnl>=0?'green':'red', sub:'' },
    { label:'Δ PnL v2-v1', val: fmt(s2.pnl-s1.pnl)+' U', cls: (s2.pnl-s1.pnl)>=0?'green':'red', sub:'' },
  ];
  document.getElementById('kpiRow').innerHTML = kpis.map(k =>
    `<div class="kpi"><div class="label">${k.label}</div>
     <div class="val ${k.cls}">${k.val}</div>
     <div class="sub">${k.sub}</div></div>`
  ).join('');
}

function renderPairTable(v1, v2) {
  const rows = PAIRS.map(sym => {
    const p1 = v1.filter(t => t.symbol === sym);
    const p2 = v2.filter(t => t.symbol === sym);
    const s1 = stats(p1), s2 = stats(p2);
    const delta = s2.pnl - s1.pnl;
    const winner = delta > 0 ? 'v2' : delta < 0 ? 'v1' : '';
    return { sym, s1, s2, delta, winner };
  });

  document.getElementById('pairBody').innerHTML = rows.map(r => `
    <tr class="${r.winner ? 'winner':''}">
      <td>${SHORT_NAME(r.sym)}</td>
      <td>${r.s1.total}</td>
      <td class="${r.s1.wr>=50?'green':'red'}">${fmtWR(r.s1.wins,r.s1.total)}</td>
      <td class="${r.s1.pnl>=0?'green':'red'}">${fmt(r.s1.pnl)}</td>
      <td>${r.s2.total}</td>
      <td class="${r.s2.wr>=50?'green':'red'}">${fmtWR(r.s2.wins,r.s2.total)}</td>
      <td class="${r.s2.pnl>=0?'green':'red'}">${fmt(r.s2.pnl)}</td>
      <td class="${r.delta>=0?'diff-positive':'diff-negative'}">${fmt(r.delta)}</td>
    </tr>`
  ).join('');
}

function cumPnl(trades) {
  // Returns [{x: time_str, y: cumulative_pnl}]
  let cum = 0;
  return trades
    .filter(t => t.close_time)
    .sort((a,b) => new Date(a.close_time)-new Date(b.close_time))
    .map(t => { cum += (t.pnl||0); return { x: t.close_time.slice(11,16), y: +cum.toFixed(4) }; });
}

function renderPnlChart(v1, v2) {
  const ctx = document.getElementById('pnlChart').getContext('2d');
  if (pnlChart) pnlChart.destroy();
  pnlChart = new Chart(ctx, {
    type: 'line',
    data: {
      datasets: [
        { label:'v1', data: cumPnl(v1), borderColor:'#40c4ff', backgroundColor:'rgba(64,196,255,.08)',
          tension:.3, pointRadius:2, fill:true },
        { label:'v2', data: cumPnl(v2), borderColor:'#00e676', backgroundColor:'rgba(0,230,118,.08)',
          tension:.3, pointRadius:2, fill:true },
      ]
    },
    options: {
      responsive:true, maintainAspectRatio:false,
      parsing: false,
      scales: {
        x: { type:'category', ticks:{ color:'#555', maxTicksLimit:8 }, grid:{ color:'#1e1e1e' } },
        y: { ticks:{ color:'#555' }, grid:{ color:'#1e1e1e' } }
      },
      plugins: { legend:{ labels:{ color:'#888' } } }
    }
  });
}

function renderWRChart(v1, v2) {
  const ctx = document.getElementById('wrChart').getContext('2d');
  if (wrChart) wrChart.destroy();
  const labels = PAIRS.map(SHORT_NAME);
  const wr1 = PAIRS.map(s => { const p=v1.filter(t=>t.symbol===s); return p.length ? +(stats(p).wr.toFixed(1)) : 0; });
  const wr2 = PAIRS.map(s => { const p=v2.filter(t=>t.symbol===s); return p.length ? +(stats(p).wr.toFixed(1)) : 0; });
  wrChart = new Chart(ctx, {
    type:'bar',
    data: {
      labels,
      datasets: [
        { label:'v1', data:wr1, backgroundColor:'rgba(64,196,255,.5)', borderColor:'#40c4ff', borderWidth:1 },
        { label:'v2', data:wr2, backgroundColor:'rgba(0,230,118,.5)', borderColor:'#00e676', borderWidth:1 },
      ]
    },
    options: {
      responsive:true, maintainAspectRatio:false,
      scales: {
        x: { ticks:{ color:'#555' }, grid:{ color:'#1e1e1e' } },
        y: { min:0, max:100, ticks:{ color:'#555', callback: v=>v+'%' }, grid:{ color:'#1e1e1e' } }
      },
      plugins: { legend:{ labels:{ color:'#888' } } }
    }
  });
}

function renderReasonChart(all) {
  const ctx = document.getElementById('reasonChart').getContext('2d');
  if (reasonChart) reasonChart.destroy();
  const counts = {};
  all.forEach(t => { const r = t.close_reason||'?'; counts[r] = (counts[r]||0)+1; });
  const labels = Object.keys(counts);
  const colorMap = { TP:'#00e676', SL:'#ff5252', TIMEOUT:'#ffd740', '?':'#555' };
  reasonChart = new Chart(ctx, {
    type:'doughnut',
    data: {
      labels,
      datasets:[{ data: labels.map(l=>counts[l]),
        backgroundColor: labels.map(l=>colorMap[l]||'#888'),
        borderWidth:1, borderColor:'#1a1a1a' }]
    },
    options: {
      responsive:true, maintainAspectRatio:false,
      plugins: { legend:{ position:'right', labels:{ color:'#888', font:{ size:11 } } } }
    }
  });
}

function renderRecent(all) {
  const recent = all
    .filter(t => t.status==='closed' && t.close_time)
    .sort((a,b) => new Date(b.close_time)-new Date(a.close_time))
    .slice(0,20);

  document.getElementById('recentBody').innerHTML = recent.map(t => {
    const pnlCls = (t.pnl||0)>=0?'green':'red';
    const ver = t.bot_variant==='cr_paper' ? '<span class="badge v1">v1</span>' : '<span class="badge v2">v2</span>';
    const candle = t.close_candle_type || '—';
    const reason = t.close_reason || '—';
    const reasonCls = reason==='TP'?'green':reason==='SL'?'red':'gold';
    return `<tr>
      <td>${(t.close_time||'').slice(11,16)}</td>
      <td>${SHORT_NAME(t.symbol||'')}</td>
      <td>${ver}</td>
      <td>${t.side||'—'}</td>
      <td class="${reasonCls}">${reason}</td>
      <td class="${pnlCls}">${fmt(t.pnl)}</td>
      <td style="color:#666;font-size:.75rem">${candle}</td>
    </tr>`;
  }).join('') || '<tr><td colspan="7" class="loading">Sin trades cerrados aún</td></tr>';
}

// Init
load();
setInterval(load, 30000);
</script>
</body>
</html>
