<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>OCO Dashboard — Supabase</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #0f1117; color: #e0e0e0; font-size: 13px; }
  h1 { padding: 14px 20px; font-size: 17px; color: #fff; border-bottom: 1px solid #2a2a3a; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  h1 span { font-size: 11px; color: #666; font-weight: normal; }
  .layout { display: flex; height: calc(100vh - 47px); }
  .sidebar { width: 220px; min-width: 220px; padding: 14px; border-right: 1px solid #2a2a3a; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
  .main { flex: 1; padding: 14px; overflow: auto; }
  .section-title { font-size: 10px; text-transform: uppercase; color: #777; letter-spacing: 0.08em; margin-bottom: 7px; }
  label { display: flex; align-items: center; gap: 6px; padding: 2px 0; cursor: pointer; font-size: 12px; }
  label:hover { color: #fff; }
  input[type=checkbox] { accent-color: #7c6af7; width: 13px; height: 13px; }
  input[type=date], input[type=text], select {
    background: #1a1a2e; border: 1px solid #2a2a3a; color: #ccc;
    padding: 5px 8px; border-radius: 4px; font-size: 11px; width: 100%;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .family-header { display: flex; align-items: center; gap: 6px; padding: 3px 0; font-weight: 600; font-size: 12px; }
  .family-pairs { padding-left: 18px; }
  .btn { background: #7c6af7; border: none; color: #fff; padding: 7px 14px; border-radius: 5px; cursor: pointer; font-size: 12px; width: 100%; }
  .btn:hover { background: #6a59e0; }
  .btn-sm { background: #2a2a3a; border: none; color: #888; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; }
  .btn-sm:hover { color: #ccc; }
  .status { font-size: 11px; color: #555; padding: 4px 0; }
  .status.ok { color: #4ade80; }
  .status.err { color: #f87171; }
  .status.loading { color: #60a5fa; }
  .tabs { display: flex; gap: 2px; margin-bottom: 14px; flex-wrap: wrap; }
  .tab { padding: 5px 13px; border-radius: 4px; cursor: pointer; font-size: 12px; color: #888; }
  .tab.active { background: #2a2a4a; color: #a78bfa; }
  .tab:hover:not(.active) { background: #1e1e2e; color: #ccc; }
  .kpi-row { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .kpi { background: #1a1a2e; border: 1px solid #2a2a3a; border-radius: 7px; padding: 11px 15px; min-width: 110px; }
  .kpi-val { font-size: 20px; font-weight: 700; }
  .kpi-lbl { font-size: 10px; color: #888; margin-top: 2px; }
  .green { color: #4ade80; } .red { color: #f87171; } .blue { color: #60a5fa; } .purple { color: #a78bfa; } .orange { color: #fb923c; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { text-align: left; padding: 5px 9px; color: #777; font-weight: 500; border-bottom: 1px solid #2a2a3a; white-space: nowrap; }
  td { padding: 5px 9px; border-bottom: 1px solid #1a1a2a; white-space: nowrap; }
  tr:hover td { background: #1a1a2e; }
  .badge { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 10px; font-weight: 600; }
  .badge-prod { background: #1a3a2a; color: #4ade80; }
  .badge-lab1 { background: #1a2a3a; color: #60a5fa; }
  .badge-meme { background: #2a1a3a; color: #c084fc; }
  .badge-lab2 { background: #3a2a1a; color: #fb923c; }
  .charts-row { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 16px; }
  .chart-box { background: #1a1a2e; border: 1px solid #2a2a3a; border-radius: 8px; padding: 14px; }
  .chart-box canvas { max-height: 220px; }
  .rank-table { display: flex; flex-direction: column; gap: 4px; max-width: 460px; }
  .rank-row { display: flex; align-items: center; gap: 8px; padding: 5px 9px; background: #1a1a2e; border-radius: 5px; }
  .rank-num { width: 18px; color: #666; font-size: 10px; }
  .rank-sym { width: 80px; font-weight: 600; font-size: 12px; }
  .rank-bar-wrap { flex: 1; height: 7px; background: #2a2a3a; border-radius: 4px; overflow: hidden; }
  .rank-bar { height: 100%; border-radius: 4px; }
  .rank-val { width: 65px; text-align: right; font-size: 11px; }
  .no-data { text-align: center; color: #444; padding: 50px; font-size: 14px; }
  .conn-block input { margin-bottom: 6px; }
  .conn-block label { font-size: 11px; color: #888; margin-bottom: 3px; display: block; }
</style>
</head>
<body>

<h1>📊 OCO Dashboard <span id="hdr-info">— conectá Supabase para cargar datos</span></h1>

<div class="layout">
<div class="sidebar">

  <div class="conn-block">
    <div class="section-title">Conexión Supabase</div>
    <label>Tabla</label>
    <input type="text" id="sb-table" value="trades" placeholder="nombre_tabla">
    <label style="margin-top:6px">Límite de filas</label>
    <select id="sb-limit">
      <option value="1000">1 000</option>
      <option value="5000" selected>5 000</option>
      <option value="10000">10 000</option>
      <option value="50000">50 000</option>
    </select>
    <button class="btn" style="margin-top:8px" onclick="fetchData()">🔄 Cargar datos</button>
    <div class="status" id="sb-status">listo</div>
  </div>

  <div>
    <div class="section-title">Fechas</div>
    <input type="date" id="date-from" onchange="render()" style="margin-bottom:5px">
    <input type="date" id="date-to" onchange="render()">
    <button class="btn-sm" onclick="clearDates()" style="margin-top:4px;width:100%">Limpiar fechas</button>
  </div>

  <div>
    <div class="section-title">Familias & Pares</div>
    <div id="family-filters"></div>
  </div>

  <div>
    <div class="section-title">Razón de cierre</div>
    <div id="reason-filters"></div>
  </div>

</div>

<div class="main">
  <div class="tabs">
    <div class="tab active" onclick="setTab('resumen')">Resumen</div>
    <div class="tab" onclick="setTab('diario')">Por día</div>
    <div class="tab" onclick="setTab('pares')">Por par</div>
    <div class="tab" onclick="setTab('ranking')">Ranking</div>
  </div>
  <div id="content"><div class="no-data">Presioná "Cargar datos" para empezar</div></div>
</div>
</div>

<script>
const SB_URL  = "https://xjznnlzvurfwrhomkxed.supabase.co";
const SB_KEY  = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhqem5ubHp2dXJmd3Job21reGVkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxODYyNDIsImV4cCI6MjEwMTc2MjI0Mn0.GAGSQ3oqTYq1zD96fQ6T--vACw8oWOUqYKWBRT9rqMc";

const FAMILIES = {
  prod: { label: 'Prod',  color: '#4ade80', pairs: ['ADA/USDT','BNB/USDT'] },
  lab1: { label: 'Lab 1', color: '#60a5fa', pairs: ['TRX/USDT','SOL/USDT','ETH/USDT','LTC/USDT'] },
  meme: { label: 'Meme',  color: '#c084fc', pairs: ['SHIB/USDT','PEPE/USDT'] },
  lab2: { label: 'Lab 2', color: '#fb923c', pairs: ['AVAX/USDT','DOGE/USDT'] },
};
const PAIR_FAMILY = {};
Object.entries(FAMILIES).forEach(([f,{pairs}]) => pairs.forEach(p => PAIR_FAMILY[p] = f));

let allTrades = [];
let checkedPairs = new Set();
let checkedReasons = new Set();
let activeTab = 'resumen';
let pieChart = null, barChart = null;

// ── Fetch Supabase ────────────────────────────────────
async function fetchData() {
  const table = document.getElementById('sb-table').value.trim();
  const limit  = document.getElementById('sb-limit').value;
  const st = document.getElementById('sb-status');
  if (!table) { st.textContent = '⚠ ingresá el nombre de la tabla'; st.className = 'status err'; return; }
  st.textContent = 'cargando…'; st.className = 'status loading';
  try {
    // Supabase REST: paginar en bloques de 1000 hasta el límite
    const maxRows = parseInt(limit);
    let rows = [];
    let from = 0;
    const pageSize = 1000;
    while (rows.length < maxRows) {
      const to = Math.min(from + pageSize - 1, maxRows - 1);
      const url = `${SB_URL}/rest/v1/${table}?select=*&order=open_time.desc&offset=${from}&limit=${pageSize}`;
      const res = await fetch(url, {
        headers: { apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}`, Range: `${from}-${to}` }
      });
      if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
      const page = await res.json();
      if (!page.length) break;
      rows = [...rows, ...page];
      if (page.length < pageSize) break;
      from += pageSize;
    }
    allTrades = rows.map(normalise);
    st.textContent = `✓ ${allTrades.length} trades cargados`; st.className = 'status ok';
    document.getElementById('hdr-info').textContent = `— ${allTrades.length} trades · tabla: ${table}`;
    initFilters();
    render();
  } catch(e) {
    st.textContent = `Error: ${e.message}`; st.className = 'status err';
  }
}

function normalise(t) {
  // Acepta campos con nombres alternativos
  const pnl = parseFloat(t.pnl_usdt ?? t.pnl ?? t.profit ?? 0);
  const sym  = t.symbol ?? t.pair ?? '';
  const dt   = (t.open_time ?? t.opened_at ?? t.created_at ?? '').slice(0, 10);
  const reason = t.close_reason ?? t.exit_reason ?? t.reason ?? '';
  return { ...t, pnl, symbol: sym, date: dt, close_reason: reason, family: PAIR_FAMILY[sym] || 'other' };
}

// ── Filters ───────────────────────────────────────────
function initFilters() {
  const allPairs = [...new Set(allTrades.map(t => t.symbol))].sort();
  checkedPairs = new Set(allPairs);
  const allReasons = [...new Set(allTrades.map(t => t.close_reason))].filter(Boolean).sort();
  checkedReasons = new Set(allReasons);

  // Build family filter
  const famMap = {};
  Object.entries(FAMILIES).forEach(([f, def]) => {
    const present = def.pairs.filter(p => allPairs.includes(p));
    if (present.length) famMap[f] = { ...def, pairs: present };
  });
  const other = allPairs.filter(p => !PAIR_FAMILY[p]);
  if (other.length) famMap['other'] = { label: 'Otros', color: '#94a3b8', pairs: other };

  const ff = document.getElementById('family-filters');
  ff.innerHTML = '';
  Object.entries(famMap).forEach(([fam, def]) => {
    const block = document.createElement('div');
    block.innerHTML = `
      <div class="family-header">
        <input type="checkbox" id="fam-${fam}" checked onchange="toggleFamily('${fam}',this.checked)">
        <span class="dot" style="background:${def.color}"></span>
        <label for="fam-${fam}" style="cursor:pointer;font-size:12px">${def.label}</label>
      </div>
      <div class="family-pairs">${def.pairs.map(p=>`
        <label><input type="checkbox" class="pair-cb" data-pair="${p}" data-fam="${fam}" checked
          onchange="togglePair('${p}',this.checked,'${fam}')"> ${p.replace('/USDT','')}</label>`).join('')}</div>`;
    ff.appendChild(block);
  });

  const rf = document.getElementById('reason-filters');
  rf.innerHTML = allReasons.map(r=>`<label><input type="checkbox" checked
    onchange="toggleReason('${r}',this.checked)"> ${r||'(sin razón)'}</label>`).join('');
}

function toggleFamily(fam, checked) {
  document.querySelectorAll(`.pair-cb[data-fam="${fam}"]`).forEach(cb => {
    cb.checked = checked;
    checked ? checkedPairs.add(cb.dataset.pair) : checkedPairs.delete(cb.dataset.pair);
  });
  render();
}
function togglePair(pair, checked, fam) {
  checked ? checkedPairs.add(pair) : checkedPairs.delete(pair);
  const all = [...document.querySelectorAll(`.pair-cb[data-fam="${fam}"]`)].every(c=>c.checked);
  document.getElementById(`fam-${fam}`).checked = all;
  render();
}
function toggleReason(r, checked) { checked ? checkedReasons.add(r) : checkedReasons.delete(r); render(); }
function clearDates() { document.getElementById('date-from').value=''; document.getElementById('date-to').value=''; render(); }

function getFiltered() {
  const from = document.getElementById('date-from').value;
  const to   = document.getElementById('date-to').value;
  return allTrades.filter(t =>
    checkedPairs.has(t.symbol) &&
    (checkedReasons.has(t.close_reason) || (!t.close_reason && checkedReasons.has(''))) &&
    (!from || t.date >= from) &&
    (!to   || t.date <= to)
  );
}

// ── Tabs ──────────────────────────────────────────────
function setTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab').forEach((el,i) =>
    el.classList.toggle('active', ['resumen','diario','pares','ranking'][i]===tab));
  render();
}

function render() {
  if (!allTrades.length) return;
  const data = getFiltered();
  const el = document.getElementById('content');
  if (!data.length) { el.innerHTML='<div class="no-data">Sin datos para los filtros seleccionados</div>'; return; }
  pieChart = barChart = null; // reset refs
  if (activeTab==='resumen') el.innerHTML = renderResumen(data);
  else if (activeTab==='diario') el.innerHTML = renderDiario(data);
  else if (activeTab==='pares') el.innerHTML = renderPares(data);
  else el.innerHTML = renderRanking(data);
  // draw charts after DOM insertion
  if (activeTab==='resumen') drawCharts(data);
  if (activeTab==='ranking') drawRankingChart(data);
}

// ── Stats helpers ─────────────────────────────────────
function stats(ts) {
  const wins = ts.filter(t=>t.pnl>0).length;
  const losses = ts.filter(t=>t.pnl<0).length;
  const pnl = ts.reduce((s,t)=>s+t.pnl,0);
  const avgWin  = ts.filter(t=>t.pnl>0).reduce((s,t)=>s+t.pnl,0) / (wins||1);
  const avgLoss = ts.filter(t=>t.pnl<0).reduce((s,t)=>s+t.pnl,0) / (losses||1);
  const wr = wins/(ts.length||1)*100;
  const ev = pnl/(ts.length||1);
  return { n: ts.length, wins, losses, pnl, wr, ev, avgWin, avgLoss };
}
const pc = v => v>0?'green':v<0?'red':'';
const fmt = v => (v>=0?'+':'')+v.toFixed(3)+'$';
const fmtWR = v => v.toFixed(1)+'%';

// ── Resumen ───────────────────────────────────────────
function renderResumen(data) {
  const s = stats(data);
  const be = Math.abs(s.avgLoss)/(s.avgWin+Math.abs(s.avgLoss))*100;
  const days = [...new Set(data.map(t=>t.date))].length;
  return `
  <div class="kpi-row">
    <div class="kpi"><div class="kpi-val ${pc(s.pnl)}">${fmt(s.pnl)}</div><div class="kpi-lbl">PnL Total</div></div>
    <div class="kpi"><div class="kpi-val ${s.wr>be?'green':'red'}">${fmtWR(s.wr)}</div><div class="kpi-lbl">Win Rate</div></div>
    <div class="kpi"><div class="kpi-val ${pc(s.ev)}">${fmt(s.ev)}</div><div class="kpi-lbl">EV / trade</div></div>
    <div class="kpi"><div class="kpi-val blue">${s.n}</div><div class="kpi-lbl">Trades</div></div>
    <div class="kpi"><div class="kpi-val purple">${days}</div><div class="kpi-lbl">Días</div></div>
    <div class="kpi"><div class="kpi-val">${fmtWR(be)}</div><div class="kpi-lbl">Break-even WR</div></div>
  </div>
  <div style="font-size:11px;color:#888;display:flex;gap:12px;margin-bottom:14px;">
    <span>avg_win <b class="green">${s.avgWin.toFixed(4)}$</b></span>
    <span>avg_loss <b class="red">${s.avgLoss.toFixed(4)}$</b></span>
    <span>wins <b>${s.wins}</b></span>
    <span>losses <b>${s.losses}</b></span>
  </div>
  <div class="section-title" style="margin-bottom:8px">Por familia</div>
  ${renderFamilyTable(data)}
  <div class="charts-row">
    <div class="chart-box" style="width:280px">
      <div class="section-title" style="margin-bottom:8px">Operaciones por par</div>
      <canvas id="pie-chart"></canvas>
    </div>
    <div class="chart-box" style="flex:1;min-width:300px">
      <div class="section-title" style="margin-bottom:8px">PnL por par</div>
      <canvas id="bar-chart"></canvas>
    </div>
  </div>`;
}

function renderFamilyTable(data) {
  const fg = {};
  data.forEach(t => { if(!fg[t.family]) fg[t.family]=[]; fg[t.family].push(t); });
  return `<table style="margin-bottom:16px"><thead><tr>
    <th>Familia</th><th>Trades</th><th>WR</th><th>EV/trade</th><th>PnL</th>
  </tr></thead><tbody>` +
  Object.entries(fg).map(([f,ts]) => {
    const s=stats(ts); const def=FAMILIES[f]||{label:f};
    return `<tr><td><span class="badge badge-${f}">${def.label||f}</span></td>
      <td>${s.n}</td><td>${fmtWR(s.wr)}</td>
      <td class="${pc(s.ev)}">${fmt(s.ev)}</td>
      <td class="${pc(s.pnl)}" style="font-weight:600">${fmt(s.pnl)}</td></tr>`;
  }).join('') + '</tbody></table>';
}

function drawCharts(data) {
  // Pie — operaciones por par
  const bySym = {};
  data.forEach(t => { bySym[t.symbol] = (bySym[t.symbol]||0)+1; });
  const labels = Object.keys(bySym);
  const colors = labels.map(sym => {
    const f = PAIR_FAMILY[sym]||'other';
    return FAMILIES[f]?.color || '#94a3b8';
  });
  const pieCtx = document.getElementById('pie-chart')?.getContext('2d');
  if (pieCtx) {
    if (pieChart) pieChart.destroy();
    pieChart = new Chart(pieCtx, {
      type: 'doughnut',
      data: { labels: labels.map(l=>l.replace('/USDT','')), datasets: [{ data: Object.values(bySym), backgroundColor: colors, borderColor: '#0f1117', borderWidth: 2 }] },
      options: { plugins: { legend: { labels: { color: '#aaa', font: { size: 11 } } } }, cutout: '55%' }
    });
  }

  // Bar — PnL por par
  const pnlBySym = {};
  data.forEach(t => { pnlBySym[t.symbol] = (pnlBySym[t.symbol]||0)+t.pnl; });
  const barLabels = Object.keys(pnlBySym).sort((a,b)=>pnlBySym[b]-pnlBySym[a]);
  const barColors = barLabels.map(sym => pnlBySym[sym] >= 0 ? '#4ade80' : '#f87171');
  const barCtx = document.getElementById('bar-chart')?.getContext('2d');
  if (barCtx) {
    if (barChart) barChart.destroy();
    barChart = new Chart(barCtx, {
      type: 'bar',
      data: { labels: barLabels.map(l=>l.replace('/USDT','')), datasets: [{ data: barLabels.map(l=>+pnlBySym[l].toFixed(3)), backgroundColor: barColors, borderRadius: 4 }] },
      options: {
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: '#888' }, grid: { color: '#1e1e2e' } },
          y: { ticks: { color: '#888', callback: v => v+'$' }, grid: { color: '#1e1e2e' } }
        }
      }
    });
  }
}

// ── Por día ───────────────────────────────────────────
function renderDiario(data) {
  const byDay = {};
  data.forEach(t => { if(!byDay[t.date]) byDay[t.date]={}; if(!byDay[t.date][t.symbol]) byDay[t.date][t.symbol]=[]; byDay[t.date][t.symbol].push(t); });
  const dates = Object.keys(byDay).sort().reverse();
  const allPairs = [...new Set(data.map(t=>t.symbol))].sort();
  let html = `<table><thead><tr><th>Fecha</th>`;
  allPairs.forEach(p => html += `<th>${p.replace('/USDT','')}</th>`);
  html += `<th>Total</th><th>WR</th><th>Trades</th></tr></thead><tbody>`;
  dates.forEach(d => {
    const ds = stats(Object.values(byDay[d]).flat());
    html += `<tr><td style="font-weight:600">${d}</td>`;
    allPairs.forEach(p => {
      const ts = byDay[d][p]||[];
      if (!ts.length) { html += '<td style="color:#333">—</td>'; return; }
      const ps = stats(ts);
      html += `<td class="${pc(ps.pnl)}" title="WR ${fmtWR(ps.wr)} | ${ps.n} trades">${fmt(ps.pnl)}</td>`;
    });
    html += `<td class="${pc(ds.pnl)}" style="font-weight:600">${fmt(ds.pnl)}</td>
             <td class="${ds.wr>28?'green':'red'}">${fmtWR(ds.wr)}</td>
             <td class="blue">${ds.n}</td></tr>`;
  });
  return html + '</tbody></table>';
}

// ── Por par ───────────────────────────────────────────
function renderPares(data) {
  const byPair = {};
  data.forEach(t => { if(!byPair[t.symbol]) byPair[t.symbol]=[]; byPair[t.symbol].push(t); });
  const rows = Object.entries(byPair).map(([sym,ts]) => ({ sym, fam: PAIR_FAMILY[sym]||'other', ...stats(ts), ts }))
               .sort((a,b) => b.pnl-a.pnl);
  return `<table><thead><tr>
    <th>Par</th><th>Familia</th><th>Trades</th><th>WR</th><th>EV/trade</th>
    <th>PnL</th><th>avg_win</th><th>avg_loss</th><th>TP</th><th>SL</th>
  </tr></thead><tbody>` +
  rows.map(r => {
    const byR = {};
    r.ts.forEach(t => { byR[t.close_reason] = (byR[t.close_reason]||0)+1; });
    return `<tr>
      <td style="font-weight:600">${r.sym.replace('/USDT','')}</td>
      <td><span class="badge badge-${r.fam}">${FAMILIES[r.fam]?.label||r.fam}</span></td>
      <td>${r.n}</td>
      <td class="${r.wr>28?'green':'red'}">${fmtWR(r.wr)}</td>
      <td class="${pc(r.ev)}">${fmt(r.ev)}</td>
      <td class="${pc(r.pnl)}" style="font-weight:600">${fmt(r.pnl)}</td>
      <td class="green">${r.avgWin.toFixed(4)}$</td>
      <td class="red">${r.avgLoss.toFixed(4)}$</td>
      <td>${byR['TP']||0}</td><td>${byR['SL']||0}</td>
    </tr>`;
  }).join('') + '</tbody></table>';
}

// ── Ranking ───────────────────────────────────────────
function renderRanking(data) {
  const byPair = {};
  data.forEach(t => { if(!byPair[t.symbol]) byPair[t.symbol]=[]; byPair[t.symbol].push(t); });
  const rows = Object.entries(byPair).map(([sym,ts]) => ({ sym, fam: PAIR_FAMILY[sym]||'other', ...stats(ts) }))
               .sort((a,b) => b.pnl-a.pnl);
  const maxAbs = Math.max(...rows.map(r=>Math.abs(r.pnl)), 0.01);

  function rankList(sorted) {
    return sorted.map((r,i) => {
      const color = FAMILIES[r.fam]?.color || '#94a3b8';
      const w = Math.abs(r.pnl)/maxAbs*100;
      return `<div class="rank-row">
        <div class="rank-num">#${i+1}</div>
        <div class="rank-sym" style="color:${color}">${r.sym.replace('/USDT','')}</div>
        <div class="rank-bar-wrap"><div class="rank-bar" style="width:${w}%;background:${r.pnl>0?'#4ade80':'#f87171'}"></div></div>
        <div class="rank-val ${pc(r.pnl)}">${fmt(r.pnl)}</div>
        <div style="font-size:10px;color:#666;width:45px;text-align:right">${fmtWR(r.wr)}</div>
      </div>`;
    }).join('');
  }

  return `
  <div style="display:flex;gap:36px;flex-wrap:wrap;margin-bottom:24px">
    <div>
      <div class="section-title" style="margin-bottom:8px">🏆 Winners</div>
      <div class="rank-table">${rankList(rows.filter(r=>r.pnl>0))}</div>
    </div>
    <div>
      <div class="section-title" style="margin-bottom:8px">💀 Losers</div>
      <div class="rank-table">${rankList([...rows].filter(r=>r.pnl<=0).reverse())}</div>
    </div>
  </div>
  <div class="section-title" style="margin-bottom:8px">Operaciones por par</div>
  <canvas id="pie-rank" style="max-width:320px;max-height:200px;margin-bottom:16px"></canvas>
  <div class="section-title" style="margin-bottom:8px">Todos — ranking PnL</div>
  <div class="rank-table">${rankList(rows)}</div>`;
}

function drawRankingChart(data) {
  const bySym = {};
  data.forEach(t => { bySym[t.symbol] = (bySym[t.symbol]||0)+1; });
  const labels = Object.keys(bySym).sort((a,b)=>bySym[b]-bySym[a]);
  const colors = labels.map(sym => FAMILIES[PAIR_FAMILY[sym]||'other']?.color || '#94a3b8');
  const ctx = document.getElementById('pie-rank')?.getContext('2d');
  if (ctx) new Chart(ctx, {
    type: 'doughnut',
    data: { labels: labels.map(l=>l.replace('/USDT','')), datasets: [{ data: labels.map(l=>bySym[l]), backgroundColor: colors, borderColor: '#0f1117', borderWidth: 2 }] },
    options: { plugins: { legend: { labels: { color: '#aaa', font: { size: 11 } } } }, cutout: '50%' }
  });
}
</script>
